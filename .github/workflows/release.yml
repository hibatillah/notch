name: Release

# Runs only when a version tag such as v0.1.0 is pushed. It checks the code, builds it and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        shell: bash
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          name=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          archive="$name-$GITHUB_REF_NAME-windows-x64"
          mkdir -p "dist/$archive"
          cp "target/x86_64-pc-windows-msvc/release/$name.exe" LICENSE README.md "dist/$archive/"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist/$archive' -DestinationPath 'dist/$archive.zip'"
          (cd dist && sha256sum "$archive.zip" > "$archive.zip.sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$ARCHIVE.zip" "dist/$ARCHIVE.zip.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
