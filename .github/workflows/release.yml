name: Release

# Runs only when a version tag such as v0.1.0 is pushed. It checks the code, builds it and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build
        shell: bash
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          name=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          installer="$name-$GITHUB_REF_NAME-windows-x64-setup"
          mkdir -p dist
          choco install innosetup --no-progress -y
          # The slashes of the compiler's options must not be taken for paths.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$version" "/DExeName=$name.exe" \
            "/DSourceExe=$(cygpath -w "$PWD/target/x86_64-pc-windows-msvc/release/$name.exe")" \
            "/O$(cygpath -w "$PWD/dist")" "/F$installer" installer/notch.iss
          (cd dist && sha256sum "$installer.exe" > "$installer.exe.sha256")
          echo "INSTALLER=$installer.exe" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$INSTALLER" "dist/$INSTALLER.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
