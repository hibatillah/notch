name: Release

# Runs only when a version tag such as v0.1.0 is pushed. It checks the code, builds it and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches both crate versions
        shell: bash
        run: |
          for manifest in Cargo.toml settings/Cargo.toml; do
            version=$(grep -m1 '^version' "$manifest" | cut -d'"' -f2)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $manifest version $version" >&2
              exit 1
            fi
          done

      - name: Install Rust
        shell: bash
        run: |
          # The settings crate (GPUI) builds only with the MSVC host toolchain.
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc

      - name: Check
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build
        shell: bash
        run: cargo build --release --workspace

      - name: Package
        shell: bash
        run: |
          name=$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)
          settings_name=$(grep -m1 '^name' settings/Cargo.toml | cut -d'"' -f2)
          release_directory="$PWD/target/x86_64-pc-windows-msvc/release"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          installer="$name-$GITHUB_REF_NAME-windows-x64-setup"
          mkdir -p dist
          choco install innosetup --no-progress -y
          # The slashes of the compiler's options must not be taken for paths.
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$version" "/DExeName=$name.exe" \
            "/DSourceExe=$(cygpath -w "$release_directory/$name.exe")" \
            "/DSettingsExeName=$settings_name.exe" \
            "/DSourceSettingsExe=$(cygpath -w "$release_directory/$settings_name.exe")" \
            "/O$(cygpath -w "$PWD/dist")" "/F$installer" installer/notch.iss
          (cd dist && sha256sum "$installer.exe" > "$installer.exe.sha256")
          echo "INSTALLER=$installer.exe" >> "$GITHUB_ENV"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$INSTALLER" "dist/$INSTALLER.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
