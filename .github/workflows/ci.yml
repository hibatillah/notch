name: CI

# Runs on every push to the default branch. Pushing a tag does not start it; tags start the release workflow.
on:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          # The settings crate (GPUI) builds only with the MSVC host toolchain.
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-msvc

      - name: Format
        shell: bash
        run: cargo fmt --all --check

      - name: Lint
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --workspace

      - name: Build
        shell: bash
        run: cargo build --release --workspace
