[package]
name = "notch"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_WinRT", "Win32_Media", "Win32_UI_Input_KeyboardAndMouse", "Media_Control", "Foundation", "Storage_Streams", "Win32_System_SystemInformation", "Graphics_Imaging", "Foundation_Numerics", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Web_Http", "Web_Http_Headers", "Data_Json", "Media", "Win32_System_Power", "Devices_Bluetooth", "Devices_Enumeration", "Foundation_Collections", "Win32_System_Time", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_DataExchange", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_EventLog", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-numerics = "0.3"
windows-core = "0.62.2"
windows-collections = "0.3.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
