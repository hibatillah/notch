[package]
name = "notch"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_WinRT", "Win32_Media", "Win32_UI_Input_KeyboardAndMouse", "Media_Control", "Foundation", "Storage_Streams", "Win32_System_SystemInformation", "Graphics_Imaging", "Foundation_Numerics", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Web_Http", "Web_Http_Headers", "Data_Json", "Media"] }
windows-numerics = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
